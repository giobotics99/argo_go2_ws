# Pose sul frame map della mappa institute_stiima_cnr (theta in radianti).
# Fonti:
#   [rilevata]  x, y rilevati in RViz (gia' in config/waypoints.yaml); theta dal design (README_instruction.md)
#   [mappa]     ricavata dalla mappa: hub = centro del corridoio davanti alle porte servite,
#               punto di vista = cella libera piu' vicina alla stima del README con margine >= 0.5 m
# Aggiungere o correggere le pose sul posto con tools/record_pose.py (stesso formato).

